[project]
name = "goods-trend"
version = "0.1.0"
description = "웹 데이터를 수집해 요즘 뜨는 굿즈를 분석하는 시스템"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
nlp = ["kiwipiepy>=0.17"]          # 한국어 형태소 분석 (신규 키워드 발견 품질 향상)
browser = ["playwright>=1.44"]     # JS 렌더링이 필요한 사이트
dashboard = ["streamlit>=1.35"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
