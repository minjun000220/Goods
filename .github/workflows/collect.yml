# 매일 굿즈 데이터를 수집하고 점수를 계산해 Supabase(PostgreSQL)에 저장한다.
# 필요한 설정: 저장소 Settings → Secrets and variables → Actions → New repository secret
#   이름: DATABASE_URL   값: Supabase 의 "Session pooler" 연결 주소 (비밀번호 포함)
name: 매일 수집

on:
  schedule:
    - cron: "17 0 * * *"      # 매일 00:17 UTC = 한국 시간 09:17 (GitHub 사정으로 늦어지거나 건너뛸 수 있음)
    - cron: "47 3 * * *"      # 백업: 03:47 UTC = 한국 시간 12:47 — 오전 실행이 이미 성공했으면 아무것도 안 함
  workflow_dispatch:           # Actions 탭에서 "Run workflow" 버튼으로 바로 실행

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RAW_STORE: "off"          # Actions 디스크는 실행 후 사라지므로 원본 저장 안 함
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 패키지 설치
        run: pip install -e ".[nlp]"

      - name: DB 주소 확인
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL 시크릿이 없습니다. Settings → Secrets and variables → Actions 에서 등록하세요."
            exit 1
          fi

      - name: 오늘 이미 수집했는지 확인
        id: check
        run: |
          done=$(python -m pipelines.run_pipeline already-ran | tail -1)
          echo "done=$done" >> "$GITHUB_OUTPUT"
          if [ "$done" = "yes" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::notice::오늘 수집이 이미 끝나서 이번 (백업) 실행은 건너뜁니다."
          fi

      - name: 수집
        if: steps.check.outputs.done != 'yes' || github.event_name != 'schedule'
        timeout-minutes: 25
        run: python -m pipelines.run_pipeline collect

      - name: 점수 계산
        if: steps.check.outputs.done != 'yes' || github.event_name != 'schedule'
        run: python -m pipelines.run_pipeline score

      - name: 수집 상태 점검
        if: steps.check.outputs.done != 'yes' || github.event_name != 'schedule'
        run: python -m monitoring.health
